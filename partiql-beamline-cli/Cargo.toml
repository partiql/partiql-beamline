[package]
name = "partiql-beamline-cli"
description = "PartiQL Beamline CLI"
readme.workspace = true
authors.workspace = true
license.workspace = true
#homepage = TODO
#repository = TODO
#keywords = TODO
#categories = TODO
exclude.workspace = true
edition.workspace = true
version.workspace = true

[dependencies]
partiql-beamline = { path = "../partiql-beamline-sim", version = "0.1" }
partiql-beamline-cliargs = { path = "../partiql-beamline-cliargs", version = "0.1" }
partiql-beamline-serde = { path = "../partiql-beamline-serde", version = "0.1" }
# Move to `partiql-extension-ddl` once out
partiql-extension-ddl = { git = "https://github.com/partiql/partiql-lang-rust.git" }
partiql-extension-ion = "0.7"
partiql-value = "0.7"

clap = { version = "4.4", features = ["derive", "wrap_help", "help", "usage", "error-context"] }
miette = { version = "7.2", features = ["fancy"] }

ion-rs = "0.18.1"

time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
