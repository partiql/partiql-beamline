name: Code Coverage

on: [push, pull_request]

env:
  RUST_TEST_TIME_UNIT: 150,5000
  RUST_TEST_TIME_INTEGRATION: 150,5000

jobs:
  build:
    name: Build and Test
    runs-on: codebuild-partiql-beamline-${{ github.run_id }}-${{ github.run_attempt }}
    # We want to run on external PRs, but not on internal ones as push automatically builds
    # H/T: https://github.com/Dart-Code/Dart-Code/commit/612732d5879730608baa9622bf7f5e5b7b51ae65
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          # Source-based coverage on stable; replaces the removed nightly `-Z profile` + grcov setup.
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Cargo Test w/ Coverage
        run: cargo llvm-cov --verbose --workspace --codecov --output-path codecov.json
      - name: Codecov Upload
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
          # Without a token (fork PRs, or if the secret is unset) the upload may be rejected; don't fail the job on it.
          fail_ci_if_error: false
