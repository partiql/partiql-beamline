[package]
name = "partiql-beamline"
authors = ["PartiQL Team <partiql-team@amazon.com>"]
description = "PartiQL Beamline"
#homepage = TODO
#repository = TODO
license = "Apache-2.0"
readme = "../README.md"
#keywords = TODO
#categories = TODO
exclude = [
    "**/.git/**",
    "**/.github/**",
    "**/.travis.yml",
    "**/.appveyor.yml",
]
edition = "2021"
version = "0.1.0"



[dependencies]
partiql-parser = "0.6"
partiql-catalog = "0.6"
partiql-source-map = "0.6"
partiql-ast = "0.6"
partiql-ast-passes = "0.6"
partiql-logical-planner = "0.6"
partiql-logical = "0.6"
partiql-value = "0.6"
partiql-eval = "0.6"
partiql-extension-ion =  "0.6"
partiql-extension-ion-functions = "0.6"

ion-rs = { version = "1.0.0-rc.2", features = ["experimental-reader", "experimental-lazy-reader"] }


once_cell = "1"


thiserror = "1.*"
miette = { version ="5.*", features = ["fancy"] }

derive_builder = "0.13"

time = "0.3"
rand = "0.8"
rand_chacha = "0.3"
rand_pcg = "0.3"
rand_distr = "0.4"
statrs = "0.16"

[features]
default = []


[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

