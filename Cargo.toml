[workspace.package]
authors = ["PartiQL Team <partiql-team@amazon.com>"]
description = "PartiQL Beamline"
homepage = "https://partiql.org/partiql-beamline/"
repository = "https://github.com/partiql/partiql-beamline"
license = "Apache-2.0"
readme = "../README.md"
keywords = ["partiql", "data-generation", "sql", "testing", "synthetic-data"]
categories = ["development-tools", "database"]
exclude = [
  "**/.git/**",
  "**/.github/**",
  "**/.travis.yml",
  "**/.appveyor.yml",
]
edition = "2021"
version = "0.1.0"

[patch.crates-io]
[workspace]
members = [
    "partiql-beamline-cli",
    "partiql-beamline-cliargs",
    "partiql-beamline-query",
    "partiql-beamline-sim",
    "partiql-beamline-serde",
]
resolver = "2"

[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

[profile.bench]
debug = true
lto = true
