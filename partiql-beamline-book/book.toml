[book]
authors = ["PartiQL Beamline Contributors"]
language = "en"
src = "src"
title = "PartiQL Beamline"
description = "A comprehensive guide to using PartiQL Beamline for synthetic data and query generation"

[preprocessor.links]

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
smart-punctuation = true
mathjax-support = false
copy-fonts = true
additional-css = []
additional-js = []
no-section-label = false
git-repository-url = "https://github.com/partiql/partiql-beamline"
edit-url-template = "https://github.com/partiql/partiql-beamline/edit/main/docs/{path}"
site-url = "/partiql-beamline/"
input-404 = ""

[output.html.fold]
enable = false
level = 0

[output.html.playground]
editable = false
copyable = true
copy-js = true
line-numbers = false
runnable = false

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.print]
enable = true
page-break = true

[output.html.redirect]

[preprocessor.index]

[build]
build-dir = "book"
create-missing = true
use-default-preprocessors = true
extra-watch-dirs = []
